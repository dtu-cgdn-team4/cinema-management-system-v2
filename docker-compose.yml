services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: cinema-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # Cổng AMQP chính cho Backend Spring Boot kết nối
      - "15672:15672"   # Giao diện Web quản lý RabbitMQ Dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
