# Test API: schema Flyway và dữ liệu cố định db/test-seed, không dùng dữ liệu mẫu db/seed.
# DB H2 riêng, tách khỏi context create-drop của CinemaApplicationTests.
spring:
  datasource:
    url: jdbc:h2:mem:cinema_testdata;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/test-seed
