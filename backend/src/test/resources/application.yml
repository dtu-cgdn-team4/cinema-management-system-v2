spring:
  datasource:
    url: jdbc:h2:mem:cinema_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  # Consumer RabbitMQ và broker nhúng chỉ bật ở profile "mq" (EmbeddedRabbitConfig)
  rabbitmq:
    listener:
      simple:
        auto-startup: false

